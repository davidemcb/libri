<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout</title>
<link rel="stylesheet" href="assets/stile.css">
<script src="https://js.stripe.com/v3/"></script>
<style>
  .checkout-wrapper { max-width: 600px; margin: 0 auto; padding: 2rem 1rem; }
  .checkout-box { background: var(--b-surface); padding: 2rem; border-radius: 8px; }
  .product-summary { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--b-border); }
  .product-line { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
  .product-line.total { font-weight: 600; font-size: 1.2rem; margin-top: 1rem; }
  #card-element { border: 1px solid var(--b-border); padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
  .btn-checkout { width: 100%; padding: 1rem; background: var(--b-text); color: var(--b-bg); border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn-checkout:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-checkout:hover:not(:disabled) { opacity: 0.9; }
  .error-message { color: #d32f2f; margin-bottom: 1rem; }
  .success-message { color: #388e3c; margin-bottom: 1rem; }
</style>
</head>
<body>

<div class="checkout-wrapper">
  <div class="checkout-box">
    <h1>Acquista</h1>

    <div class="product-summary" id="summary">
      <!-- Generato da JS -->
    </div>

    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>

    <form id="checkout-form">
      <div id="card-element"></div>
      <input type="email" id="email" placeholder="tuaemail@esempio.it" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--b-border); border-radius: 4px; margin-bottom: 1rem;">
      <button type="submit" class="btn-checkout" id="submit-btn">Paga ora</button>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
  import { firebaseConfig, stripeConfig } from './firebase-config.js';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const stripe = Stripe(stripeConfig.publicKey);
  const elements = stripe.elements();
  const cardElement = elements.create('card');
  cardElement.mount('#card-element');

  let currentUser = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('email').value = user.email;
    }
  });

  // Ottieni i libri dal URL o da sessionStorage
  const params = new URLSearchParams(window.location.search);
  let bookIds = params.get('books')?.split(',') || JSON.parse(sessionStorage.getItem('checkoutBooks') || '[]');

  if (bookIds.length === 0) {
    window.location.href = 'index.html';
  }

  // Mostra il riassunto
  const summary = document.getElementById('summary');
  const bookTitles = {
    'duau': 'Da uomo a uomo',
    'sv': 'Senza veli',
    'pac': 'Prenditi a carezze'
  };

  let total = 0;
  bookIds.forEach(bookId => {
    const product = stripeConfig.products[bookId];
    if (product) {
      summary.innerHTML += `
        <div class="product-line">
          <span>${product.name}</span>
          <span>€${(product.price / 100).toFixed(2)}</span>
        </div>
      `;
      total += product.price;
    }
  });

  // Controlla se c'è sconto bundle
  if (bookIds.length === 3) {
    const bundlePrice = stripeConfig.products.bundle3.price;
    if (bundlePrice < total) {
      summary.innerHTML += `
        <div class="product-line" style="color: #388e3c;">
          <span>Sconto bundle</span>
          <span>-€${((total - bundlePrice) / 100).toFixed(2)}</span>
        </div>
      `;
      total = bundlePrice;
    }
  }

  summary.innerHTML += `
    <div class="product-line total">
      <span>Totale</span>
      <span>€${(total / 100).toFixed(2)}</span>
    </div>
  `;

  // Submit checkout
  document.getElementById('checkout-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submit-btn');
    const email = document.getElementById('email').value;

    if (!currentUser) {
      alert('Accedi prima di acquistare');
      window.location.href = 'auth.html';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Elaborazione...';

    try {
      // Crea il payment intent tramite la Cloud Function
      const response = await fetch('https://YOUR_FIREBASE_FUNCTION_URL/createCheckoutSession', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: currentUser.uid,
          bookIds,
          email
        })
      });

      const { sessionId } = await response.json();

      // Reindirizza a Stripe Checkout
      const result = await stripe.redirectToCheckout({ sessionId });

      if (result.error) {
        document.getElementById('error-message').textContent = result.error.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Paga ora';
      }
    } catch (error) {
      document.getElementById('error-message').textContent = 'Errore durante il pagamento';
      console.error(error);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Paga ora';
    }
  });
</script>

</body>
</html>
