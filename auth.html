<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accedi — Biblioteca</title>
<link rel="stylesheet" href="assets/stile.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
  .auth-box { max-width: 400px; width: 100%; }
  .auth-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--b-border); }
  .auth-tabs button { background: none; border: none; padding: 1rem 0; font-size: 1rem; cursor: pointer; color: var(--b-muted); font-weight: 500; }
  .auth-tabs button.active { color: var(--b-text); border-bottom: 2px solid var(--b-text); }
  .auth-form { display: none; }
  .auth-form.active { display: block; }
  .form-group { margin-bottom: 1.5rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
  .form-group input { width: 100%; padding: 0.75rem; border: 1px solid var(--b-border); border-radius: 4px; font-size: 1rem; }
  .form-group input:focus { outline: none; border-color: var(--b-text); }
  .btn-submit { width: 100%; padding: 0.75rem; background: var(--b-text); color: var(--b-bg); border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  .btn-submit:hover { opacity: 0.9; }
  .auth-error { color: #d32f2f; font-size: 0.9rem; margin-bottom: 1rem; }
  .auth-success { color: #388e3c; font-size: 0.9rem; margin-bottom: 1rem; }
  .loader { display: none; text-align: center; }
  .loader.active { display: block; }
</style>
</head>
<body>

<div class="auth-box">
  <h1 style="text-align: center; margin-bottom: 2rem;">Biblioteca</h1>

  <div class="auth-tabs">
    <button class="tab-btn active" data-tab="login">Accedi</button>
    <button class="tab-btn" data-tab="register">Registrati</button>
  </div>

  <!-- Login -->
  <form class="auth-form active" id="login-form" data-tab="login">
    <div class="auth-error" id="login-error"></div>
    <div class="form-group">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" required placeholder="tu@esempio.it">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn-submit">Accedi</button>
  </form>

  <!-- Registrazione -->
  <form class="auth-form" id="register-form" data-tab="register">
    <div class="auth-error" id="register-error"></div>
    <div class="auth-success" id="register-success"></div>
    <div class="form-group">
      <label for="register-email">Email</label>
      <input id="register-email" type="email" required placeholder="tu@esempio.it">
    </div>
    <div class="form-group">
      <label for="register-password">Password (min. 6 caratteri)</label>
      <input id="register-password" type="password" required placeholder="••••••••" minlength="6">
    </div>
    <button type="submit" class="btn-submit">Registrati</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

  // Firebase config — AGGIORNA QUANDO HAI LE CREDENZIALI
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      btn.classList.add('active');
      document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    });
  });

  // Login
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorDiv = document.getElementById('login-error');

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'biblioteca.html';
    } catch (error) {
      errorDiv.textContent = 'Email o password errata';
    }
  });

  // Register
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('register-email').value;
    const password = document.getElementById('register-password').value;
    const errorDiv = document.getElementById('register-error');
    const successDiv = document.getElementById('register-success');

    errorDiv.textContent = '';
    successDiv.textContent = '';

    try {
      await createUserWithEmailAndPassword(auth, email, password);
      successDiv.textContent = 'Registrazione completata! Accedi adesso.';
      document.getElementById('register-email').value = '';
      document.getElementById('register-password').value = '';
    } catch (error) {
      if (error.code === 'auth/email-already-in-use') {
        errorDiv.textContent = 'Questa email è già registrata';
      } else if (error.code === 'auth/weak-password') {
        errorDiv.textContent = 'Password troppo debole';
      } else {
        errorDiv.textContent = 'Errore durante la registrazione';
      }
    }
  });
</script>

</body>
</html>
