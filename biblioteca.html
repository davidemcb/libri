<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La mia biblioteca</title>
<link rel="stylesheet" href="assets/stile.css">
<style>
  .page-wrapper { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; }
  .page-header h1 { margin: 0; }
  .logout-btn { background: none; border: 1px solid var(--b-border); padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
  .logout-btn:hover { background: var(--b-surface); }
  .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; }
  .book-card { background: var(--b-surface); border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .book-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
  .book-cover { width: 100%; aspect-ratio: 5/8; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; text-align: center; padding: 1rem; font-size: 0.9rem; }
  .book-info { padding: 1.5rem; }
  .book-info h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
  .book-info p { margin: 0; color: var(--b-muted); font-size: 0.9rem; }
  .read-btn { display: block; margin-top: 1rem; padding: 0.75rem; background: var(--b-text); color: var(--b-bg); text-align: center; border-radius: 4px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; }
  .read-btn:hover { opacity: 0.9; }
  .empty-state { text-align: center; padding: 4rem 2rem; }
  .empty-state h2 { color: var(--b-muted); }
</style>
</head>
<body>

<div class="page-wrapper">
  <div class="page-header">
    <h1>La mia biblioteca</h1>
    <button class="logout-btn" id="logout-btn">Esci</button>
  </div>

  <div class="books-grid" id="books-grid">
    <div class="empty-state">
      <h2>Nessun libro acquistato</h2>
      <p>Una volta acquistato, i tuoi libri appariranno qui.</p>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
  import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

  // Firebase config — AGGIORNA QUANDO HAI LE CREDENZIALI
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Verifica autenticazione
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }

    // Carica i libri acquistati
    const ordersQuery = query(
      collection(db, 'orders'),
      where('userId', '==', user.uid),
      where('status', '==', 'completed')
    );

    const querySnapshot = await getDocs(ordersQuery);
    const booksMap = {};

    querySnapshot.forEach((doc) => {
      const order = doc.data();
      if (order.books) {
        order.books.forEach(bookId => {
          booksMap[bookId] = true;
        });
      }
    });

    // Catalogo di tutti i libri disponibili
    const books = [
      {
        id: 'duau',
        title: 'Da uomo a uomo',
        subtitle: '17 luoghi in cui un uomo incontra sé stesso',
        pages: '348 pagine'
      },
      {
        id: 'sv',
        title: 'Senza veli',
        subtitle: 'Il corpo di una donna attraverso le età della vita',
        pages: '~380 pagine'
      },
      {
        id: 'pac',
        title: 'Prenditi a carezze',
        subtitle: 'Un invito a ridurre la distanza',
        pages: '76 pagine'
      }
    ];

    const grid = document.getElementById('books-grid');
    const userBooks = books.filter(b => booksMap[b.id]);

    if (userBooks.length === 0) {
      grid.innerHTML = '<div class="empty-state"><h2>Nessun libro acquistato</h2><p>Una volta acquistato, i tuoi libri appariranno qui.</p></div>';
    } else {
      grid.innerHTML = userBooks.map(book => `
        <div class="book-card">
          <div class="book-cover">${book.title}</div>
          <div class="book-info">
            <h3>${book.title}</h3>
            <p>${book.subtitle}</p>
            <p style="margin-top: 0.5rem; font-size: 0.85rem;">${book.pages}</p>
            <button class="read-btn" onclick="window.location.href='reader.html?book=${book.id}'">Leggi</button>
          </div>
        </div>
      `).join('');
    }
  });

  // Logout
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
